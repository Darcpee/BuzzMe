<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Number | PingoApp</title>
    <link href="./output-style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        body{
            font-family: "Inter", sans-serif;
        }

        /* Hide Number Arrows */

        input::-webkit-inner-spin-button,
        input::-webkit-outer-spin-button{

            -webkit-appearance:none;
            margin:0;

        }

        input[type="number"]{

            -moz-appearance:textfield;

        }

    </style>

</head>

<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <!-- ================= HEADER ================= -->

    <header
        class="h-16 flex items-center px-4">

        <button
            onclick="history.back()"
            class="w-10 h-10 rounded-full hover:bg-gray-200 transition flex items-center justify-center">

            <i class="fa-solid fa-arrow-left text-lg"></i>

        </button>

    </header>

    <!-- ================= MAIN ================= -->

    <main
        class="flex-1 flex flex-col items-center px-5 pt-10 pb-10 max-w-md w-full mx-auto">

        <!-- App Icon -->

        <div
            class="w-20 h-20 bg-blue-600 rounded-2xl shadow-lg flex items-center justify-center">

            <i class="fa-solid fa-comment-sms text-white text-4xl"></i>

        </div>

        <!-- Heading -->

        <div class="text-center mt-8">

            <h1
                class="text-3xl font-bold">

                Verify your phone number

            </h1>

            <p
                class="text-xs text-gray-500 mt-4 leading-5">

               Enter your username and the 6-digit PIN to verify your account and access personalized features. This ensures the security of your account and allows you to enjoy a safe and seamless experience on pingoapp.

            </p>

        </div>

        <!-- OTP Form Starts Here -->

        <form
    id="registerForm"
    class="w-full mt-10">

    <!-- Username -->

    <div class="mb-8">

        <label
            for="userName"
            class="block text-sm font-semibold text-gray-700 mb-2">

            Username

        </label>

        <div
            class="flex items-center bg-gray-100 border border-gray-300 rounded-xl px-4 py-3 focus-within:ring-2 focus-within:ring-blue-600">

            <i class="fa-solid fa-user text-gray-400 mr-3"></i>

            <input
                id="userName"
                name="userName"
                type="text"
                placeholder="Enter your username"
                class="flex-1 bg-transparent outline-none">

        </div>

    </div>

    <!-- PIN -->

    <label
        class="block mt-8 mb-3 text-sm font-semibold text-gray-700">

        Enter your 6-digit PIN

    </label>

    <div class="flex items-center item-center gap-3">

        <input type="password" maxlength="1" inputmode="numeric"
            class="otp-input w-12 h-14 rounded-xl border border-gray-300 bg-gray-100 text-center text-2xl font-bold">

        <input type="password" maxlength="1" inputmode="numeric"
            class="otp-input w-12 h-14 rounded-xl border border-gray-300 bg-gray-100 text-center text-2xl font-bold">

        <input type="password" maxlength="1" inputmode="numeric"
            class="otp-input w-12 h-14 rounded-xl border border-gray-300 bg-gray-100 text-center text-2xl font-bold">

        <span class="text-gray-400 text-2xl font-bold">•</span>

        <input type="password" maxlength="1" inputmode="numeric"
            class="otp-input w-12 h-14 rounded-xl border border-gray-300 bg-gray-100 text-center text-2xl font-bold">

        <input type="password" maxlength="1" inputmode="numeric"
            class="otp-input w-12 h-14 rounded-xl border border-gray-300 bg-gray-100 text-center text-2xl font-bold">

        <input type="password" maxlength="1" inputmode="numeric"
            class="otp-input w-12 h-14 rounded-xl border border-gray-300 bg-gray-100 text-center text-2xl font-bold">

    </div>

    <!-- Login Button -->

    <button
        id="verifyBtn"
        type="submit"
        class="w-full mt-10 bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-semibold flex items-center justify-center gap-2">

        <i class="fa-solid fa-right-to-bracket"></i>

        Login

    </button>

</form>

    </main>
        <!-- Decorative Background -->

    <div class="fixed bottom-0 left-0 -z-10 overflow-hidden pointer-events-none">

        <div
            class="absolute -left-24 -bottom-24 w-72 h-72 rounded-full bg-blue-300 opacity-30 blur-3xl">

        </div>

        <div
            class="absolute right-0 bottom-0 w-64 h-64 rounded-full bg-green-300 opacity-20 blur-3xl">

        </div>

    </div>

    <script src="./js/otp.js"></script>

</body>

</html>
