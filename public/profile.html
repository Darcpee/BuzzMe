<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PingoApp - Profile Setup</title>

    <link href="./output-style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body class="bg-gray-50 min-h-screen font-sans text-gray-900">

    <!-- HEADER -->

    <header class="fixed top-0 left-0 right-0 h-16 bg-white shadow-sm flex items-center justify-between px-4 z-50">

        <div class="flex items-center gap-3">

            <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
                <i class="fa-solid fa-camera text-blue-600 text-lg"></i>
            </div>

            <h1 class="text-2xl font-bold text-blue-600">
                PingoApp
            </h1>

        </div>

        <button
            id="helpBtn"
            type="button"
            class="text-gray-600 hover:text-blue-600">

            Help

        </button>

    </header>

    <!-- MAIN -->

    <main class="max-w-md mx-auto pt-24 pb-10 px-4">

        <section class="text-center">

            <h2 class="text-3xl font-bold">
                Profile Info
            </h2>

            <p class="mt-3 text-gray-500">
                Please provide your name and an optional profile photo.
            </p>

        </section>

        <!-- =========================
             FORM STARTS HERE
        ========================== -->

        <form
            id="profileForm"
            enctype="multipart/form-data">

            <!-- PROFILE IMAGE -->

            <section class="mt-10 flex justify-center">

                <div class="relative inline-block">

                    <!-- FILE INPUT -->

                    <input
                        id="avatarInput"
                        name="profileImage"
                        type="file"
                        accept="image/*"
                        class="hidden">

                    <!-- IMAGE PICKER -->

                    <label
                        for="avatarInput"
                        class="group relative flex items-center justify-center
                        w-40 h-40 rounded-full
                        bg-gray-100 border-[3px]
                        border-dashed border-gray-300
                        overflow-hidden cursor-pointer
                        shadow-lg hover:border-blue-600
                        transition">

                        <!-- PREVIEW -->

                        <img
                            id="avatarPreview"
                            src=""
                            class="hidden absolute inset-0 w-full h-full object-cover">

                        <!-- PLACEHOLDER -->

                        <div
                            id="avatarPlaceholder"
                            class="absolute inset-0 flex flex-col items-center justify-center">

                            <i class="fa-solid fa-user text-6xl text-gray-400"></i>

                            <p class="mt-2 text-sm text-gray-500">
                                Upload Photo
                            </p>

                        </div>

                        <!-- HOVER -->

                        <div
                            class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex flex-col items-center justify-center">

                            <i class="fa-solid fa-camera text-white text-3xl"></i>

                            <span class="text-white text-sm mt-2">
                                Change Photo
                            </span>

                        </div>

                    </label>

                    <!-- CAMERA BUTTON -->

                    <label
                        for="avatarInput"
                        class="absolute -bottom-1 -right-1
                        w-12 h-12 rounded-full
                        bg-blue-600 border-4 border-white
                        flex items-center justify-center
                        cursor-pointer shadow-xl">

                        <i class="fa-solid fa-camera text-white"></i>

                    </label>

                </div>

            </section>

            <!-- USERNAME -->

            <section class="mt-10">

                <label
                    for="userName"
                    class="block mb-2 text-sm font-semibold text-blue-600">

                    Username or Full Name

                </label>

                <div
                    class="flex items-center bg-gray-100 border border-gray-300 rounded-xl px-4 py-3">

                    <input
                        id="userName"
                        name="userName"
                        type="text"
                        placeholder="e.g. Alex Rivera"
                        class="flex-1 bg-transparent outline-none text-lg">

                    <i class="fa-solid fa-pen-to-square text-gray-400"></i>

                </div>

                <p class="mt-2 text-xs text-gray-500">
                    This name will be visible to everyone who chats with you.
                </p>

            </section>

            <!-- SUBMIT -->

            <section class="mt-12">

                <button
                    id="finishBtn"
                    type="submit"
                    disabled
                    class="w-full h-14 rounded-xl
                    bg-blue-600 text-white
                    font-semibold
                    flex items-center justify-center gap-3
                    opacity-50 cursor-not-allowed
                    transition">

                    <span>Finish Setup</span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </section>

        </form>

        <!-- FORM ENDS -->

        <section class="mt-6">

            <p class="text-center text-xs text-gray-500">

                By continuing you agree to our
                <span class="text-blue-600">Terms of Service</span>
                and
                <span class="text-blue-600">Privacy Policy</span>.

            </p>

        </section>

    </main>

    <script src="./js/profile.js"></script>

</body>
</html>
